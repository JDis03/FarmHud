name: Lua regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check syntax and regressions
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/test_compat.lua
          lua5.1 tests/test_lifecycle.lua
          lua5.1 tests/test_buttons.lua
          lua5.1 tests/test_hooks.lua
          lua5.1 tests/test_native_skin.lua
          python3 tests/test_package.py
